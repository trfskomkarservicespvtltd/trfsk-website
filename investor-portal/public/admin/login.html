<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1>Admin Login</h1>
    <div class="sub">Manage investors, transactions, and KYC</div>
    <div class="err" id="err"></div>
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@company.com"></div>
    <div class="field"><label>Password</label><input id="password" type="password"></div>
    <button class="btn btn-gold full" id="loginBtn">Log In</button>
  </div>
</div>
<script>
document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.classList.remove('show');
  if(!email || !password){ errEl.textContent='Enter your email and password'; errEl.classList.add('show'); return; }
  try{
    const r = await fetch('/api/auth/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({email, password})
    });
    const data = await r.json();
    if(!r.ok){ errEl.textContent = data.error || 'Login failed'; errEl.classList.add('show'); return; }
    window.location.href = '/admin/dashboard.html';
  }catch(e){ errEl.textContent='Could not reach the server'; errEl.classList.add('show'); }
});
document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
</script>
</body>
</html>
